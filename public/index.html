<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRUD Operations - Task 1</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-badge">TASK 1</div>
      <h1>CRUD Operations on Array of Items</h1>
      <p class="subtitle">HTML, CSS, Express.js & REST API</p>
    </header>

    <!-- Notification Toast / Alert -->
    <div id="notification" class="notification hidden"></div>

    <!-- Input Form Section (Wireframe Card) -->
    <section class="form-card">
      <div class="card-header">
        <h2 id="form-title">Add New Item</h2>
        <span id="edit-badge" class="badge-edit hidden">Edit Mode</span>
      </div>

      <form id="item-form">
        <input type="hidden" id="item-id">

        <div class="form-group">
          <label for="item-name">Name</label>
          <input 
            type="text" 
            id="item-name" 
            name="name" 
            placeholder="e.g. Book, Pen" 
            autocomplete="off" 
            required
          >
        </div>

        <div class="form-group">
          <label for="item-price">Price</label>
          <input 
            type="number" 
            id="item-price" 
            name="price" 
            placeholder="e.g. 250, 25" 
            step="0.01" 
            min="0" 
            required
          >
        </div>

        <div class="form-actions">
          <button type="submit" id="submit-btn" class="btn btn-primary">
            Submit
          </button>
          <button type="button" id="cancel-btn" class="btn btn-secondary hidden">
            Cancel
          </button>
        </div>
      </form>
    </section>

    <!-- Items Table Section (Wireframe Table) -->
    <section class="table-card">
      <div class="card-header table-header-flex">
        <h2>Items List</h2>
        <span class="items-count" id="items-count">0 items</span>
      </div>

      <div class="table-responsive">
        <table class="items-table" id="items-table">
          <thead>
            <tr>
              <th class="th-id">ID</th>
              <th class="th-name">Name</th>
              <th class="th-price">Price</th>
              <th class="th-action">Action</th>
            </tr>
          </thead>
          <tbody id="items-tbody">
            <!-- Dynamic rows will be rendered here -->
            <tr class="loading-row">
              <td colspan="4">Loading items from server...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Empty State -->
      <div id="empty-state" class="empty-state hidden">
        <p>No items found in the array. Add one using the form above!</p>
      </div>
    </section>

    <!-- Footer info -->
    <footer class="app-footer">
      <p>Connected to <code>http://localhost:3000/api/items</code> &bull; REST API Backend</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
